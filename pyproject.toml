[project]
name = "stadium-pass-agent"
version = "0.1.0"
description = "Seat-mapping agent for the Stadium Pass AI demo"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "numpy>=1.26",
  "pillow>=10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
